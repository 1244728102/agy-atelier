<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Star Neko Atelier · 星语猫娘工坊</title>
<style>
  :root {
    --bg-1: #140e2c;
    --bg-2: rgba(28, 20, 58, 0.88);
    --bg-3: rgba(44, 32, 88, 0.72);
    --fg-1: #f4eeff;
    --fg-2: #b9addf;
    --gold: #e9c27a;
    --gold-soft: #f4dfae;
    --bd-1: rgba(233, 194, 122, 0.36);
    --accent: #b69cf5;
    --sakura: #f2a3d6;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STZhongsong", Georgia, serif;
    --font: var(--font-sans, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background:
      radial-gradient(ellipse 90% 50% at 10% 0%, rgba(242, 163, 214, 0.14), transparent 70%),
      radial-gradient(ellipse 80% 50% at 90% 100%, rgba(182, 156, 245, 0.16), transparent 70%),
      var(--bg-1);
    color: var(--fg-1); font-family: var(--font); font-size: 12.5px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(90deg, rgba(34, 24, 70, 0.95), rgba(24, 17, 50, 0.95));
    border-bottom: 1px solid var(--bd-1);
    font-family: var(--serif); letter-spacing: 0.08em; color: var(--gold-soft);
  }
  .main { padding: 14px; display: flex; flex-direction: column; gap: 12px; max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--bg-2);
    border: 1px solid var(--bd-1);
    border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: inset 0 0 0 1px rgba(182, 156, 245, 0.14), 0 10px 28px rgba(8, 4, 24, 0.42);
  }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .lbl { color: var(--fg-1); font-weight: 500; }
  input, select, button.btn {
    background: var(--bg-3); color: var(--fg-1);
    border: 1px solid rgba(233, 194, 122, 0.32);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; font-family: inherit;
  }
  input[type="range"] { accent-color: var(--accent); padding: 0; }
  button.btn { cursor: pointer; font-weight: 600; transition: all 0.15s ease; }
  button.btn:hover { border-color: var(--gold); }
  button.btn.primary {
    background: linear-gradient(180deg, #fefcff 0%, #efe8ff 55%, #e2d6ff 100%);
    border-color: var(--gold); color: #251b4d;
    font-family: var(--serif); letter-spacing: 0.08em;
    box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(8, 4, 24, 0.35);
  }
  button.btn.primary:hover {
    background: linear-gradient(180deg, #ffffff 0%, #f7e9ff 55%, #f2d3ee 100%);
  }
  .badge {
    font-size: 11px; padding: 2px 10px; border-radius: 999px;
    background: rgba(182, 156, 245, 0.16);
    border: 1px solid var(--bd-1); color: var(--gold-soft);
    font-family: var(--font); letter-spacing: 0;
  }
  .notice {
    font-size: 11px; line-height: 1.55; color: var(--fg-2);
    border-top: 1px dashed rgba(233, 194, 122, 0.28); padding-top: 8px;
  }
</style>
</head>
<body>
<div class="topbar">
  <b>✦ Star Neko Atelier · 星语猫娘工坊</b>
  <span class="badge" id="st-badge">未检测</span>
</div>
<div class="main" id="main"></div>

<script type="module">
/*__EXT_APPS_SDK__*/

const app = new App({ name: 'Star Neko Atelier · 星语猫娘工坊', version: '0.2.0' }, {});
const state = { cfg: null, active: false, msg: '' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function applyTheme(ctx) {
  if (ctx?.theme) applyDocumentTheme(ctx.theme);
  if (ctx?.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
}
app.onhostcontextchanged = applyTheme;

app.ontoolresult = (res) => {
  const sc = res?.structuredContent;
  if (!sc) return;
  if (sc.cfg) state.cfg = sc.cfg;
  if (sc.active !== undefined) state.active = sc.active;
  if (sc.msg) state.msg = sc.msg;
  render();
};

async function callA(name, args = {}) {
  const r = await app.callServerTool({ name, arguments: args });
  return r?.structuredContent || {};
}

function render() {
  const c = state.cfg || { themeMode: 'dark', opacity: 0.85, blur: 16, accent: '#b69cf5', showLace: true, wallpaperPath: '' };
  document.getElementById('st-badge').textContent = state.active ? '✦ 已装扮' : '未注入';

  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="row"><span class="lbl">工坊主题质感</span>
        <select id="a-theme">
          <option value="dark" ${c.themeMode === 'dark' ? 'selected' : ''}>星夜紫罗兰（暗色女仆工坊）</option>
          <option value="light" ${c.themeMode === 'light' ? 'selected' : ''}>雪原陶瓷白（亮色磨砂气泡）</option>
        </select>
      </div>
      <div class="row"><span class="lbl">猫娘壁纸浓度（${Math.round((c.opacity ?? 0.85) * 100)}%）</span>
        <input id="a-op" type="range" min="20" max="100" value="${Math.round((c.opacity ?? 0.85) * 100)}" style="width:180px" />
      </div>
      <div class="row"><span class="lbl">磨砂玻璃模糊（${c.blur ?? 16}px）</span>
        <input id="a-blur" type="range" min="0" max="30" value="${c.blur ?? 16}" style="width:180px" />
      </div>
      <div class="row"><span class="lbl">星语强调色（薰衣草紫 / 樱粉 / 异瞳金）</span>
        <input id="a-acc" type="color" value="${esc(c.accent || '#b69cf5')}" />
      </div>
      <div class="row"><span class="lbl">显示侧栏 U 形蕾丝花边与蝴蝶结（maid-atelier 风格）</span>
        <input id="a-lace" type="checkbox" ${c.showLace !== false ? 'checked' : ''} />
      </div>
      <div class="row"><span class="lbl">壁纸路径</span>
        <input id="a-wall" value="${esc(c.wallpaperPath || '')}" style="flex:1" />
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" id="a-clear">还原原生界面</button>
        <button class="btn primary" id="a-apply">✦ 应用星语猫娘工坊</button>
      </div>
      ${state.msg ? `<div class="badge">${esc(state.msg)}</div>` : ''}
      <div class="notice">
        设计致敬：界面布局与侧栏 U 形花边设计参考 <b>Small-tailqwq/dsh-deep-whale (maid-atelier)</b>（MIT 代码许可）；本插件内全部星辰角饰、猫爪暗纹、U 形蕾丝 SVG 均为面向《星语 · 雪原》猫娘壁纸的原创矢量绘制，未复用原仓库受 CC BY-NC-SA 4.0 约束的鲸鱼娘美术图片。
      </div>
    </div>
  `;

  document.getElementById('a-apply').onclick = async () => {
    const sc = await callA('atelier_apply', {
      themeMode: document.getElementById('a-theme').value,
      opacity: Number(document.getElementById('a-op').value) / 100,
      blur: Number(document.getElementById('a-blur').value),
      accent: document.getElementById('a-acc').value,
      showLace: document.getElementById('a-lace').checked,
      wallpaperPath: document.getElementById('a-wall').value.trim(),
    });
    state.cfg = sc.cfg || state.cfg;
    state.active = !!sc.active;
    state.msg = sc.msg || '已应用星语猫娘工坊皮肤';
    render();
  };

  document.getElementById('a-clear').onclick = async () => {
    const sc = await callA('atelier_clear', {});
    state.active = false;
    state.msg = sc.msg || '已还原原样';
    render();
  };
}

try {
  await app.connect();
  applyTheme(app.getHostContext());
  render();
} catch (err) {
  document.getElementById('main').innerHTML = `<div class="card">连接失败: ${esc(err?.message || err)}</div>`;
}
</script>
</body>
</html>
